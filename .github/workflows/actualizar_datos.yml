name: Bot Extractor de Partidos

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v3

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar librerias
        run: pip install -r requirements.txt

      - name: Ejecutar el bot de extraccion
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python descargar_datos.py

      - name: Guardar el nuevo CSV en GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add datos_reales_selecciones.csv
          git commit -m "Actualizacion diaria de datos" || echo "No hay cambios nuevos"
          git push
